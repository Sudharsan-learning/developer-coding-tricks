# Rebuilds the site every evening so scheduled tips switch from "On Instagram <date>" to their publish date.
# Setup: Vercel → Project → Settings → Git → Deploy Hooks → create one, then add it as the
# repository secret VERCEL_DEPLOY_HOOK (GitHub → Settings → Secrets and variables → Actions).
name: Daily rebuild
on:
  schedule:
    - cron: "17 14 * * *" # 19:47 IST, after the evening post
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK not set, skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
